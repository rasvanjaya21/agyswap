name: Skills upstream

# Fails when skills/ is behind addyosmani/agent-skills HEAD.
# Fix locally with `uv run python scripts/skills.py`, then commit.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Check vendored skills
        run: uv run --no-project python scripts/skills.py --check
