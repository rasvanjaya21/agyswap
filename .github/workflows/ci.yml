name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Build
        run: uv build

      # accounts.json holds refresh tokens; the wheel must carry only the package.
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          (whl,) = glob.glob("dist/*.whl")
          bad = [n for n in zipfile.ZipFile(whl).namelist()
                 if not n.startswith(("agyswap/", "agyswap_cli-"))]
          assert not bad, f"unexpected files in wheel: {bad}"
          print(f"{whl}: ok")
          PY
