[project]
name = "agyswap-cli"
version = "0.3.1"
description = "Switch between multiple Antigravity CLI accounts, with a quota dashboard for every account"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15",
    "textual>=8.2.8,<9",
]
authors = [{name = "rasvanjaya21", email = "rasvanjaya21@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["antigravity", "agy", "gemini", "account-switcher", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rasvanjaya21/agyswap"
Repository = "https://github.com/rasvanjaya21/agyswap"
Issues = "https://github.com/rasvanjaya21/agyswap/issues"
Changelog = "https://github.com/rasvanjaya21/agyswap/releases"

[project.scripts]
agyswap = "agyswap.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agyswap"]

[tool.hatch.build.targets.sdist]
include = ["src/agyswap", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated or vendored: docs/ (scripts/docs.py), skills/ (scripts/skills.py), graphify-out/.
extend-exclude = ["docs", "skills", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
