name: Skills upstream

# Fails when skills/ is behind addyosmani/agent-skills HEAD.
# Fix locally with `uv run python scripts/skills.py`, then commit.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check vendored skills
        run: uv run --no-project python scripts/skills.py --check
